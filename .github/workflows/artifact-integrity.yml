name: Artifact integrity

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'atelier-prebeta-*'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify archived artifact hashes
        run: sha256sum --check ARTIFACTS-SHA256.txt

      - name: Verify archive structure
        run: |
          unzip -t release/atelier-0.4.32-a11y-visible-labels.zip
          unzip -t release/premium-forum-core-0.4.19-csv-validation-compat.zip
          test "$(unzip -Z1 release/atelier-0.4.32-a11y-visible-labels.zip | awk -F/ 'NF { print $1; exit }')" = "atelier"
          test "$(unzip -Z1 release/premium-forum-core-0.4.19-csv-validation-compat.zip | awk -F/ 'NF { print $1; exit }')" = "premium-forum-core"

      - name: Lint PHP
        run: find atelier premium-forum-core -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run importer validation harness
        run: php tools/test-pfc-validation.php test-fixtures/valid test-fixtures/invalid
